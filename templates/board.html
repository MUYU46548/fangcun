<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 tegula</title>
<style>
  :root{
    --bg:#eef0f4;
    --ink:#3c4150;
    --muted:#6b7180;
    --accent:#9b8fc4;
    --accent-soft:#c3bce0;
    --card:#ffffff;
    --border:#e4e2ee;
    --shadow:0 8px 32px rgba(90,90,130,0.12);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;position:relative;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.38;z-index:0;pointer-events:none}
  .blob.b1{width:460px;height:460px;background:#cfc6ec;top:-140px;left:-100px}
  .blob.b2{width:420px;height:420px;background:#cdd9ee;bottom:-130px;right:-90px}
  #bar{position:relative;z-index:2;padding:10px 16px;background:rgba(255,255,255,.72);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);display:flex;justify-content:space-between;
    align-items:center;flex-wrap:wrap;gap:8px}
  #bar .title{font-weight:700;letter-spacing:.02em;color:var(--ink);font-size:15px}
  #bar .title small{color:var(--accent);font-weight:600;margin-left:6px;font-size:13px}
  #bar .ctrls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #bar select,#bar input{padding:4px 8px;border:1px solid var(--border);border-radius:8px;
    font-size:12px;background:#fff;color:var(--ink);outline:none;font-family:inherit}
  #bar input#search{width:140px}
  #bar button{cursor:pointer;padding:4px 12px;border:0;border-radius:8px;font-size:12px;
    font-weight:600;background:var(--accent);color:#fff}
  #bar button.ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
  #views{position:relative;z-index:2;padding:6px 16px;display:flex;gap:6px;background:rgba(255,255,255,.5);
    border-bottom:1px solid var(--border)}
  .vbtn{font-size:12px;cursor:pointer;padding:4px 14px;border:1px solid var(--border);border-radius:999px;
    background:#fff;color:var(--muted);font-weight:600}
  .vbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #board{position:relative;z-index:1;display:flex;gap:12px;padding:14px;align-items:flex-start;
    overflow-x:auto;min-height:60vh}
  .col{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    min-width:240px;padding:10px;flex:1;box-shadow:var(--shadow)}
  .col.empty{border-style:dashed;opacity:.62;box-shadow:none;background:#fbfbfe}
  .emptyhint{color:var(--muted);font-size:11px;text-align:center;padding:16px 0;
    border:1px dashed var(--border);border-radius:10px;margin-top:2px}
  .col h3{margin:4px 0 10px;font-size:13px;color:var(--muted);font-weight:700;
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  .col h3 .n{background:var(--accent-soft);color:#4a4368;border-radius:999px;
    padding:0 8px;font-size:11px;font-weight:600}
  .card{border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin-bottom:8px;
    background:#fbfbfe;cursor:pointer;transition:background .15s,box-shadow .15s}
  .card:hover{background:#f1eefb;box-shadow:0 4px 14px rgba(120,110,170,.14)}
  .card.active-t{border-left:3px solid var(--accent);background:#f4f1fc}
  .card.overdue{border-left:3px solid #c96a6a;background:#faf3f3}
  .prio-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;flex:none}
  .prio-高{background:#c96a6a}.prio-中{background:#d9a44a}.prio-低{background:#7a9e6b}
  .card.dragover{outline:2px dashed var(--accent);background:#f1eefb}
  .card .ttl{font-size:13px;font-weight:600;line-height:1.4}
  .card .batch{display:inline-block;background:var(--accent-soft);color:#4a4368;
    border-radius:6px;font-size:10px;padding:1px 6px;margin-right:5px;font-weight:600}
  .card .ptags{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .ptag{background:#eef0fb;color:#5b5478;border-radius:6px;font-size:10px;padding:1px 6px}
  .prog{background:#e7f0ea;color:#3c6b54;border-radius:6px;font-size:10px;padding:1px 6px;font-weight:600}
  .card small{color:var(--muted);display:block;margin-top:4px;font-size:11px}
  .mv{opacity:0;transition:opacity .12s;background:transparent;border:0;cursor:pointer;
    font-size:11px;color:var(--muted);padding:0 3px;line-height:1}
  .card:hover .mv{opacity:1}
  .mv:hover{color:var(--accent)}
  /* 状态色标（低饱和，契合雾灰紫） */
  .st{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;font-weight:600;margin-left:auto}
  .st-draft{background:#e9e4f5;color:#5b4b86}
  .st-review{background:#ece8f7;color:#6a5b95}
  .st-todo{background:#e3edf6;color:#3f5b78}
  .st-doing{background:#e1f0e8;color:#3c6b54}
  .st-verify{background:#f6ecdc;color:#7a5a2e}
  .st-done{background:#e3f1de;color:#3f6b3a}
  .st-reject{background:#f6e2e2;color:#8a4343}
  /* 待验收醒目（done 回写后的验收引导） */
  .st-verify.pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(190,132,58,.45)}50%{box-shadow:0 0 0 5px rgba(190,132,58,0)}}
  /* 搁置提示：待办/草稿超 3 天灰显 + 角标 */
  .card.stale{opacity:.52;filter:saturate(.55)}
  .card.stale:hover{opacity:.8;filter:none}
  .stalebadge{display:inline-block;background:#e3e5ea;color:#7a7f8c;border-radius:6px;
    font-size:10px;padding:1px 6px;margin-left:5px;font-weight:600}
  /* 模态框 */
  #overlay,#roverlay{position:fixed;inset:0;background:rgba(60,65,80,.32);
    backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50}
  #modal,#rmodal{background:#fff;border-radius:16px;padding:18px 20px;width:460px;max-height:88vh;
    overflow:auto;box-shadow:var(--shadow);border:1px solid var(--border)}
  #modal h3,#rmodal h3{margin:0 0 12px;font-size:16px;color:var(--ink)}
  #modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px;font-weight:600}
  #modal input,#modal select,#modal textarea{width:100%;box-sizing:border-box;padding:6px 8px;
    border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--ink);outline:none;
    font-family:inherit}
  #modal textarea{height:64px;resize:vertical}
  #modal .row2{display:flex;gap:10px}
  #modal .row2>div{flex:1}
  .projbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .projbox label{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:12px;
    font-weight:500;color:var(--ink);background:#f5f4fa;border:1px solid var(--border);
    border-radius:8px;padding:3px 8px;cursor:pointer}
  .projbox input{width:auto;margin:0}
  .acts{margin-top:16px;display:flex;gap:6px;justify-content:flex-end}
  .acts button{padding:6px 14px;border:0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  .acts .pri{background:var(--accent);color:#fff}
  .acts .warn{background:#e8a34a;color:#fff}
  .acts .danger{background:#d98a8a;color:#fff}
  .acts .ghost{background:#eee;color:#333}
  #poverlay{position:fixed;inset:0;background:rgba(60,65,80,.32);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:50}
  #pmodal{background:#fff;border-radius:16px;padding:18px 20px;width:480px;max-height:88vh;
    overflow:auto;box-shadow:var(--shadow);border:1px solid var(--border)}
  #pmodal h3{margin:0 0 12px;font-size:16px;color:var(--ink)}
  #pBody .pv{margin-bottom:10px}
  #pBody .pv .k{color:var(--muted);font-weight:600;font-size:12px;display:block;margin-bottom:2px}
  #pBody .pv .val{white-space:pre-wrap;word-break:break-word}
  #pBody ul{margin:2px 0 0 18px;padding:0}
  #pBody li{margin:2px 0}
  .planrow{display:flex;gap:7px;align-items:flex-start;cursor:pointer;padding:3px 6px;
    border-radius:6px;line-height:1.5}
  .planrow:hover{background:#f5f4fa}
  .planrow .chk{flex:none;font-size:13px}
  .planrow .ptxt{word-break:break-word}
  .planrow.done .ptxt{text-decoration:line-through;color:var(--muted)}
  #soverlay{position:fixed;inset:0;background:rgba(60,65,80,.32);backdrop-filter:blur(4px);
    display:none;align-items:flex-start;justify-content:center;z-index:60;padding-top:5vh}
  #smodal{background:#fff;border-radius:16px;padding:18px 22px;width:560px;max-height:90vh;
    overflow:auto;box-shadow:var(--shadow);border:1px solid var(--border)}
  #smodal h3{margin:0 0 14px;font-size:17px;color:var(--ink)}
  #smodal .sect{border-top:1px solid var(--border);padding:14px 0;margin-top:6px}
  #smodal .sect h4{margin:0 0 10px;font-size:14px;color:var(--accent)}
  #smodal .memlist,#smodal .projlist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  #smodal .memrow{display:flex;align-items:center;justify-content:space-between;background:var(--bg);
    border:1px solid var(--border);border-radius:10px;padding:6px 12px;font-size:13px}
  #smodal .memrow .x{background:transparent;border:none;color:#b35;font-size:16px;cursor:pointer;line-height:1}
  #smodal .newproj{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
  #smodal .newproj input{font-size:12px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div id="bar">
  <span class="title">方寸 tegula<small id="count">0</small></span>
  <span class="ctrls">
    <select id="projFilter"></select>
    <select id="groupMode">
      <option value="status">按状态</option>
      <option value="batch">按批次</option>
      <option value="project">按项目</option>
    </select>
    <input id="search" placeholder="搜索标题/编号/内容">
    <select id="sortMode" title="排序方式" onchange="render()">
      <option value="active">活跃优先</option>
      <option value="id">按编号</option>
      <option value="mtime">按最近更新</option>
    </select>
    <button onclick="openNew()">+ 新建</button>
    <button class="ghost" onclick="quickDispatch()" title="派最高优先级的待办任务给 Hermes（新终端窗口）">⚡ 派活</button>
    <button class="ghost" onclick="load(true)">刷新</button>
    <button class="ghost" onclick="openSettings()">设置</button>
  </span>
</div>
<div id="views">
  <button class="vbtn on" data-view="active" onclick="setView('active')">看板</button>
  <button class="vbtn" data-view="archive" onclick="setView('archive')">归档</button>
  <button class="vbtn" data-view="trash" onclick="setView('trash')">回收站</button>
</div>
<div id="board"></div>
<div id="overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <h3 id="mTitle">编辑</h3>
    <label>标题<input id="f_title"></label>
    <div class="row2">
      <div><label>状态<select id="f_status"></select></label></div>
      <div><label>批次<input id="f_batch"></label></div>
    </div>
    <div class="row2">
      <div><label>截止（如 09-10）<input id="f_due" placeholder="可选"></label></div>
      <div><label>优先级（高中低）<input id="f_prio" placeholder="可选"></label></div>
    </div>
    <label>项目（勾选，可多归属）</label>
    <div class="projbox" id="f_project"></div>
    <div class="row2">
      <div><label>指派<select id="f_assignee"></select></label></div>
      <div><label>验收<select id="f_accept"></select></label></div>
    </div>
    <label>资源 · 资料（路径）<input id="f_resdoc"></label>
    <label>资源 · 工具（逗号分隔）<input id="f_restool"></label>
    <label>方案（每行一项，支持 - [ ] / - [x]）<textarea id="f_plan"></textarea></label>
    <label>结果记录<textarea id="f_result"></textarea></label>
    <div class="acts">
      <button class="ghost" onclick="closeModal()">取消</button>
      <button class="danger" onclick="doDelete()">删除</button>
      <button class="warn" onclick="doArchive()">归档</button>
      <button class="pri" onclick="save()">保存</button>
    </div>
  </div>
</div>
<div id="roverlay" onclick="if(event.target===this)closeR()">
  <div id="rmodal">
    <h3 id="rTitle">还原</h3>
    <div id="rInfo" style="font-size:13px;color:#444"></div>
    <div class="acts">
      <button class="ghost" onclick="closeR()">取消</button>
      <button class="pri" onclick="doRestore()">还原到看板</button>
    </div>
  </div>
</div>
<div id="poverlay" onclick="if(event.target===this)closeP()">
  <div id="pmodal">
    <h3 id="pTitle">任务详情</h3>
    <div id="pBody" style="font-size:13px;color:var(--ink);line-height:1.7"></div>
    <div class="acts">
      <button class="ghost" onclick="closeP()">关闭</button>
      <button class="ghost" onclick="quickDispatch(curId)">⚡ 派活</button>
      <button class="pri" onclick="toEdit()">编辑</button>
    </div>
  </div>
</div>
<div id="soverlay" onclick="if(event.target===this)closeSettings()">
  <div id="smodal">
    <h3>设置 · 管理</h3>
    <div class="sect">
      <h4>成员（指派/验收下拉选项）</h4>
      <div id="memList" class="memlist"></div>
      <div class="row2">
        <input id="memNew" placeholder="新增成员名">
        <button class="ghost" onclick="memAdd()">+ 添加</button>
      </div>
      <button class="pri" onclick="memSave()">保存成员</button>
    </div>
    <div class="sect">
      <h4>项目（registry.yaml）</h4>
      <div id="projList" class="projlist"></div>
      <div class="newproj">
        <input id="np_id" placeholder="id（英文，无空格）">
        <input id="np_name" placeholder="显示名">
        <input id="np_repo" placeholder="仓库路径">
        <input id="np_tools" placeholder="tools（逗号分隔，可选）">
        <button class="ghost" onclick="projAdd()">+ 新增项目</button>
      </div>
      <button class="pri" onclick="projSave()">保存项目变更</button>
    </div>
    <div class="acts">
      <button class="ghost" onclick="closeSettings()">关闭</button>
    </div>
    <div id="sMsg" style="font-size:12px;color:#b35;min-height:16px;"></div>
  </div>
</div>
<script>
const STATUSES=["草稿","待审批","待办","进行中","待验收","完成","驳回"];
const STCLASS={"草稿":"draft","待审批":"review","待办":"todo","进行中":"doing","待验收":"verify","完成":"done","驳回":"reject"};
const REGISTRY=__REGISTRY__;
const MEMBERS=__MEMBERS__;
let TASKS=[]; let curId=null; let curTask=null; let curProj="__all__"; let curView="active";
let curEditMtime=0;
let lastHash="";
const LS_KEY="tegula_ui";
function loadUI(){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||"{}");return s;}catch(e){return {};}}
function saveUI(){try{localStorage.setItem(LS_KEY,JSON.stringify({view:curView,proj:curProj,sort:el("sortMode").value,group:el("groupMode").value}));}catch(e){}}
function pname(id){return REGISTRY[id]?REGISTRY[id].name:id;}
function el(id){return document.getElementById(id);}
function sv(v){return (v||"").split(",").map(s=>s.trim()).filter(Boolean);}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtTime(ts){
  if(!ts) return "—";
  const now=Date.now(), d=new Date(ts*1000), diff=(now-ts*1000)/1000;
  const pad=n=>String(n).padStart(2,"0");
  const hh=pad(d.getHours()), mm=pad(d.getMinutes());
  if(diff<60) return "刚刚";
  if(diff<3600) return Math.floor(diff/60)+" 分钟前";
  if(diff<86400 && d.getDate()===new Date(now).getDate()) return "今天 "+hh+":"+mm;
  if(diff<86400*2) return "昨天 "+hh+":"+mm;
  if(diff<86400*7) return Math.floor(diff/86400)+" 天前";
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function fmtAbs(ts){
  if(!ts) return "无更新时间";
  const d=new Date(ts*1000), pad=n=>String(n).padStart(2,"0");
  return "更新于 "+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
(function init(){
  const ui=loadUI();
  if(ui.view&&["active","archive","trash"].includes(ui.view))curView=ui.view;
  if(ui.proj)curProj=ui.proj;
  const pf=el("projFilter");
  let h='<option value="__all__">全部项目</option>';
  Object.entries(REGISTRY).forEach(([id,p])=>{h+='<option value="'+esc(id)+'">'+esc(p.name)+'</option>';});
  pf.innerHTML=h; pf.value=curProj;
  pf.onchange=()=>{curProj=pf.value; saveUI(); load(true);};
  el("f_status").innerHTML=STATUSES.map(s=>"<option>"+s+"</option>").join("");
  fillAssigneeSelects();
  const pbox=el("f_project");
  Object.entries(REGISTRY).forEach(([id,p])=>{
    const lab=document.createElement("label");
    const cb=document.createElement("input");cb.type="checkbox";cb.value=id;
    lab.appendChild(cb);lab.appendChild(document.createTextNode(p.name));
    pbox.appendChild(lab);
  });
  if(ui.sort)el("sortMode").value=ui.sort; else el("sortMode").value="active";
  if(ui.group)el("groupMode").value=ui.group;
  el("search").oninput=render;
  el("groupMode").onchange=()=>{saveUI();render();};
  el("sortMode").onchange=()=>{saveUI();render();};
  document.querySelectorAll("#views .vbtn").forEach(b=>b.classList.toggle("on",b.dataset.view===curView));
  el("board").addEventListener("click",e=>{const c=e.target.closest(".card"); if(!c) return; openCard(c.dataset.id);});
  let dragId=null;
  el("board").addEventListener("dragstart",e=>{const c=e.target.closest(".card"); if(!c)return; dragId=c.dataset.id; e.dataTransfer.setData("text/plain",dragId);});
  el("board").addEventListener("dragover",e=>{const col=e.target.closest(".col"); if(col){e.preventDefault();}});
  el("board").addEventListener("drop",e=>{const col=e.target.closest(".col"); if(!col||!dragId) return; e.preventDefault(); const st=col.dataset.status; if(st&&curView==="active"){ moveStatus(dragId,st); }});
  document.addEventListener("keydown",e=>{
    if(e.key!=="Escape")return;
    if(el("soverlay").style.display==="flex")closeSettings();
    else if(el("roverlay").style.display==="flex")closeR();
    else if(el("poverlay").style.display==="flex")closeP();
    else if(el("overlay").style.display==="flex")closeModal();
  });
})();
function setView(v){curView=v;document.querySelectorAll("#views .vbtn").forEach(b=>b.classList.toggle("on",b.dataset.view===v));saveUI();load(true);}
async function load(force){
  try{
    const url="/tasks.json?view="+encodeURIComponent(curView)+(curProj!=="__all__"?("&project="+encodeURIComponent(curProj)):"");
    const r=await fetch(url);const d=await r.json();
    el("count").textContent=d.length;
    const h=JSON.stringify(d);
    if(force||h!==lastHash){
      lastHash=h; TASKS=d; render();
      refreshPreviewIfOpen();
    }
  }catch(err){console.error("load failed",err);}
}
function refreshPreviewIfOpen(){
  if(el("poverlay").style.display==="flex"&&curId){
    const t=TASKS.find(x=>x.id===curId);
    if(t)openPreview(t);
  }
}
function taskAgeDays(t){   // 从 id 日期推算任务年龄（task-YYYYMMDD-NNN）
  try{
    const ds=(t.id||"").split("-")[1];
    if(!ds||ds.length!==8)return 0;
    const d=new Date(+ds.slice(0,4),+ds.slice(4,6)-1,+ds.slice(6,8));
    return Math.floor((Date.now()-d.getTime())/86400000);
  }catch(e){return 0;}
}
function isStale(t){
  return ["待办","草稿"].includes(t.状态||"") && taskAgeDays(t)>=3;
}
function render(){
  const q=(el("search").value||"").trim().toLowerCase();
  const mode=el("groupMode").value;
  const filtered=TASKS.filter(t=>!q ||
    (t.标题||"").toLowerCase().includes(q) ||
    (t.id||"").toLowerCase().includes(q) ||
    (t.项目||[]).join(" ").toLowerCase().includes(q) ||
    (t.方案||[]).join(" ").toLowerCase().includes(q) ||
    (t.结果记录||"").toLowerCase().includes(q));
  const sortMode=el("sortMode").value;
  if(sortMode==="mtime") filtered.sort((a,b)=>(b.mtime||0)-(a.mtime||0));
  else if(sortMode==="active"){
    const w=s=>({待审批:4,待办:4,进行中:5,待验收:4,草稿:1,完成:0,驳回:0}[s]||1);
    const pv2=t=>{const pr=(t.优先级||"");return pr==="高"?2:(pr==="中"?1:0);};
    filtered.sort((a,b)=>{
      const wa=w(a.状态||"草稿"), wb=w(b.状态||"草稿");
      if(wa!==wb)return wb-wa;
      if(pv2(a)!==pv2(b))return pv2(b)-pv2(a);
      return ((a.id||"")<(b.id||"")?-1:1);
    });
  }
  else filtered.sort((a,b)=>((a.id||"")<(b.id||"")?-1:1));
  const cols={}; let colOrder=[];
  if(mode==="status"){
    filtered.forEach(t=>{const k=t.状态||"草稿";(cols[k]=cols[k]||[]).push(t);});
    colOrder=STATUSES.slice();  // 七列常驻，空列也可作为拖拽目标
    Object.keys(cols).forEach(k=>{if(!colOrder.includes(k))colOrder.push(k);}); // 兜底：非标准状态也显示
  }else{
    const order=[];
    function push(gv,t){if(!(gv in cols)){cols[gv]=[];order.push(gv);}cols[gv].push(t);}
    filtered.forEach(t=>{
      let keys;
      if(mode==="batch")keys=[t.批次||"未分批次"];
      else keys=(t.项目&&t.项目.length)?t.项目:["未归属"];
      keys.forEach(k=>push(k,t));
    });
    colOrder=order.slice().sort();
  }
  const board=el("board");
  const sl=board.scrollLeft;   // 保留横向滚动位置，重绘不再拽回起点
  board.innerHTML="";
  colOrder.forEach(gv=>{
    const items=cols[gv]||[];
    const col=document.createElement("div");col.className="col";
    if(mode==="status"){
      col.dataset.status=gv;
      if(!items.length)col.classList.add("empty");
    }
    const h3=document.createElement("h3");
    const nm=document.createElement("span");nm.textContent=gv;
    const n=document.createElement("span");n.className="n";n.textContent=items.length;
    h3.appendChild(nm);h3.appendChild(n);col.appendChild(h3);
    if(!items.length){
      const hint=document.createElement("div");hint.className="emptyhint";
      hint.textContent=(mode==="status")?"拖入任务":"（空）";
      col.appendChild(hint);
    }
    items.forEach(t=>{
      const c=document.createElement("div");c.className="card";c.dataset.id=t.id;c.draggable=true;
      const stv=t.状态||"草稿";
      if(["进行中","待验收","待审批","待办"].includes(stv))c.classList.add("active-t");
      if(isStale(t))c.classList.add("stale");
      const today=new Date(), pad2=n=>String(n).padStart(2,"0");
      const todayStr=String(today.getFullYear()).slice(2)+"-"+pad2(today.getMonth()+1)+"-"+pad2(today.getDate());
      if(t.截止 && stv!=="完成" && stv!=="驳回" && String(t.截止)<=todayStr)c.classList.add("overdue");
      const head=document.createElement("div");head.style.display="flex";head.style.alignItems="center";head.style.gap="6px";
      const b=document.createElement("b");b.className="ttl";
      if(t.批次){
        const bt=document.createElement("span");bt.className="batch";bt.textContent="批"+t.批次;
        b.appendChild(bt);
      }
      b.appendChild(document.createTextNode(" "+(t.标题||"")));
      head.appendChild(b);
      const i=STATUSES.indexOf(stv);
      const stCls=STCLASS[stv]||"draft";
      const st=document.createElement("span");st.className="st st-"+stCls+(stv==="待验收"?" pulse":"");st.textContent=stv;
      head.appendChild(st);
      if(mode==="status"){
        if(i>0){
          const bp=document.createElement("button");bp.className="mv";bp.textContent="◀";
          bp.title="退回 "+STATUSES[i-1];
          bp.onclick=ev=>{ev.stopPropagation();moveStatus(t.id,STATUSES[i-1]);};
          head.appendChild(bp);
        }
        if(i<STATUSES.length-1){
          const bn=document.createElement("button");bn.className="mv";bn.textContent="▶";
          bn.title="推进到 "+STATUSES[i+1];
          bn.onclick=ev=>{ev.stopPropagation();moveStatus(t.id,STATUSES[i+1]);};
          head.appendChild(bn);
        }
      }
      if(t.优先级){
        const pd=document.createElement("span");pd.className="prio-dot prio-"+t.优先级;pd.title="优先级 "+t.优先级;
        head.appendChild(pd);
      }
      const tags=document.createElement("div");tags.className="ptags";
      const plan=t.方案||[];
      const markable=plan.filter(s=>/\[[ xX]\]/.test(s)).length;
      if(markable){
        const done=plan.filter(s=>/\[x\]/i.test(s)).length;
        const pr=document.createElement("span");pr.className="prog";pr.textContent="方案 "+done+"/"+markable;
        tags.appendChild(pr);
      }
      (t.项目||[]).forEach(id=>{const sp=document.createElement("span");sp.className="ptag";sp.textContent=pname(id);tags.appendChild(sp);});
      if(isStale(t)){
        const sb=document.createElement("span");sb.className="stalebadge";sb.textContent="搁置 "+taskAgeDays(t)+" 天";
        tags.appendChild(sb);
      }
      if(["草稿","待审批","待办"].includes(stv)){
        const dp=document.createElement("button");dp.className="mv";dp.style.marginLeft="auto";dp.textContent="⚡";
        dp.title="一键派活：新终端窗口执行（hermes chat），状态自动置进行中";
        dp.onclick=ev=>{ev.stopPropagation();quickDispatch(t.id);};
        tags.appendChild(dp);
      }
      const sm=document.createElement("small");sm.textContent=t.id+" · 指派 "+(t.指派||"—")+" · "+fmtTime(t.mtime);
      c.title=fmtAbs(t.mtime);
      c.appendChild(head);c.appendChild(tags);c.appendChild(sm);col.appendChild(c);
    });
    board.appendChild(col);
  });
  board.scrollLeft=sl;
}
function setProjChecks(list){document.querySelectorAll("#f_project input").forEach(cb=>cb.checked=list.includes(cb.value));}
function getProjChecks(){return Array.from(document.querySelectorAll("#f_project input:checked")).map(cb=>cb.value);}
function openCard(id){const t=TASKS.find(x=>x.id===id);if(!t)return;curId=id; if(curView==="active")openPreview(t);else openRestore(t);}
function pv(k,v){return '<div class="pv"><span class="k">'+k+'</span><div class="val">'+v+'</div></div>';}
function planRow(t,i,s){
  const checked=/\[x\]/i.test(s);
  const txt=esc(s.replace(/\[[ xX]\]/,"").replace(/^-\s*/,"").trim());
  return '<div class="planrow'+(checked?" done":"")+'" onclick="togglePlan(event,'+i+')">'
    +'<span class="chk">'+(checked?"☑":"☐")+'</span><span class="ptxt">'+(txt||"—")+'</span></div>';
}
function openPreview(t){
  if(typeof t==="string"){t=TASKS.find(x=>x.id===t);}
  if(!t)return;
  curId=t.id; curTask=t;
  el("pTitle").textContent=t.id;
  const projTags=(t.项目||[]).map(pname).join("、")|| "—";
  const res=t.资源||{};
  const planHtml=(t.方案&&t.方案.length)?("<div>"+t.方案.map((s,i)=>planRow(t,i,s)).join("")+"</div>"):"—";
  const body=
    pv("标题",esc(t.标题||"—"))+
    pv("状态 / 批次",(t.状态||"草稿")+" · "+(t.批次?("批"+esc(t.批次)):"未分批")
      +(t.优先级?" · 优先级 "+esc(t.优先级):"")+(t.截止?" · 截止 "+esc(t.截止):""))+
    pv("项目",esc(projTags))+
    pv("指派 / 验收",esc(t.指派||"—")+" / "+esc(t.验收||"—"))+
    pv("资源 · 资料",esc(res.资料||"—"))+
    pv("资源 · 工具",(res.工具&&res.工具.length)?esc(res.工具.join("、")):"—")+
    pv("方案",planHtml)+
    pv("结果记录",esc(t.结果记录||"—"))+
    pv("最近更新",fmtAbs(t.mtime));
  el("pBody").innerHTML=body;
  el("poverlay").style.display="flex";
}
function closeP(){el("poverlay").style.display="none";}
async function togglePlan(ev,i){
  ev.stopPropagation();
  const t=TASKS.find(x=>x.id===curId);
  if(!t)return;
  const arr=(t.方案||[]).slice();
  const s=arr[i]||"";
  if(/\[x\]/i.test(s)) arr[i]=s.replace(/\[[xX]\]/,"[ ]");
  else if(/\[ \]/.test(s)) arr[i]=s.replace("[ ]","[x]");
  else return;
  t.方案=arr;
  openPreview(t);
  const r=await post({action:"edit",id:t.id,fields:{方案:arr,expected_mtime:t.mtime||0}});
  if(!r.ok){lastHash="";load(true);}
  else load();
}
async function quickDispatch(id){
  if(!id){   // 顶栏 ⚡：自动挑最高优先级的待办一个
    const cands=TASKS.filter(t=>t.状态==="待办");
    if(!cands.length){alert("没有「待办」状态的任务可派。");return;}
    const pv=t=>t.优先级==="高"?2:(t.优先级==="中"?1:0);
    cands.sort((a,b)=>pv(b)-pv(a)||((a.id||"")<(b.id||"")?-1:1));
    id=cands[0].id;
  }
  const t=TASKS.find(x=>x.id===id);
  if(t&&(t.状态==="完成"||t.状态==="驳回")){alert("该任务已是终态，不派活。");return;}
  const r=await post({action:"dispatch",id:id});
  if(r.ok){lastHash="";load(true);}
}
function fillAssigneeSelects(){
  const opts='<option value=""></option>'+MEMBERS.map(m=>'<option>'+esc(m)+'</option>').join("");
  el("f_assignee").innerHTML=opts;
  el("f_accept").innerHTML=opts;
}
function openSettings(){
  const ml=el("memList"); ml.innerHTML="";
  MEMBERS.forEach((m,idx)=>{
    const row=document.createElement("div");row.className="memrow";
    const sp=document.createElement("span");sp.textContent=m;
    const del=document.createElement("button");del.className="x";del.textContent="×";
    del.onclick=()=>{MEMBERS.splice(idx,1);openSettings();};
    row.appendChild(sp);row.appendChild(del);ml.appendChild(row);
  });
  const pl=el("projList"); pl.innerHTML="";
  Object.entries(REGISTRY).forEach(([id,p])=>{
    const row=document.createElement("div");row.className="memrow";
    const sp=document.createElement("span");sp.innerHTML="<b>"+esc(id)+"</b> · "+esc(p.name);
    const del=document.createElement("button");del.className="x";del.textContent="×";
    del.onclick=()=>{ if(!confirm("删除项目 "+id+"？（仅从方寸注册表移除，不删仓库）"))return; pendingDelProjects.push(id); row.style.opacity=0.4; del.disabled=true; };
    row.appendChild(sp);row.appendChild(del);pl.appendChild(row);
  });
  el("sMsg").textContent="";
  el("soverlay").style.display="flex";
}
let pendingDelProjects=[];
function closeSettings(){el("soverlay").style.display="none";}
function memAdd(){
  const v=el("memNew").value.trim();
  if(!v)return;
  if(MEMBERS.includes(v)){el("sMsg").textContent="已存在："+v;return;}
  MEMBERS.push(v);el("memNew").value="";openSettings();
}
async function memSave(){
  const r=await post({action:"reg_save",members:MEMBERS.slice()});
  if(r.ok){el("sMsg").style.color="#3a8";el("sMsg").textContent="成员已保存";}
  else{el("sMsg").style.color="#b35";el("sMsg").textContent="失败："+r.msg;}
}
function projAdd(){
  const id=el("np_id").value.trim(),name=el("np_name").value.trim(),repo=el("np_repo").value.trim(),tools=el("np_tools").value.trim();
  if(!id||!name||!repo){el("sMsg").textContent="id/显示名/仓库路径 必填";return;}
  if(REGISTRY[id]){el("sMsg").textContent="id 已存在："+id;return;}
  pendingAddProjects.push({id,name,repo,tools});
  el("np_id").value="";el("np_name").value="";el("np_repo").value="";el("np_tools").value="";
  el("sMsg").style.color="#3a8";el("sMsg").textContent="已加入待添加："+id+"（点保存项目变更生效）";
}
let pendingAddProjects=[];
async function projSave(){
  const r=await post({action:"reg_save",del_projects:pendingDelProjects.slice(),add_projects:pendingAddProjects.slice()});
  if(r.ok){pendingDelProjects=[];pendingAddProjects=[];el("sMsg").style.color="#3a8";el("sMsg").textContent="项目已保存，刷新看板生效";load(true);}
  else{el("sMsg").style.color="#b35";el("sMsg").textContent="失败："+r.msg;}
}
function toEdit(){if(!curTask){const t=TASKS.find(x=>x.id===curId);curTask=t;}if(!curTask)return;closeP();openEdit(curTask);}
function openEdit(t){curId=t.id;
  el("mTitle").textContent="编辑 "+t.id;
  f_title.value=t.标题||"";f_status.value=t.状态||"草稿";f_batch.value=t.批次||"";
  f_due.value=t.截止||"";f_prio.value=t.优先级||"";
  setProjChecks(t.项目||[]);f_assignee.value=t.指派||"";f_accept.value=t.验收||"";
  const res=t.资源||{};f_resdoc.value=res.资料||"";f_restool.value=(res.工具||[]).join(", ");
  f_plan.value=(t.方案||[]).join("\n");f_result.value=t.结果记录||"";
  curEditMtime=t.mtime||0;
  el("overlay").style.display="flex";}
function openNew(){curId=null;
  el("mTitle").textContent="新建任务";
  f_title.value="";f_status.value="草稿";f_batch.value="";f_due.value="";f_prio.value="";
  setProjChecks(["fangcun-base"]);f_assignee.value="hermes";f_accept.value="human";
  f_resdoc.value="";f_restool.value="";f_plan.value="- [ ] ";f_result.value="";
  el("overlay").style.display="flex";}
function closeModal(){el("overlay").style.display="none";}
function openRestore(t){el("rTitle").textContent="还原 "+t.id;
  el("rInfo").innerHTML="<b>"+esc(t.标题||"")+"</b><br>当前位于："+(curView==="archive"?"归档":"回收站")+"<br><small>"+esc(t.id)+"</small>";
  el("roverlay").style.display="flex";}
function closeR(){el("roverlay").style.display="none";}
async function post(body){const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();if(!j.ok)alert("失败："+j.msg);return j;}
async function save(){const fields={
  标题:f_title.value,状态:f_status.value,批次:f_batch.value,截止:f_due.value,优先级:f_prio.value,
  项目:getProjChecks(),指派:f_assignee.value,验收:f_accept.value,
  资源资料:f_resdoc.value,资源工具:sv(f_restool.value),
  方案:f_plan.value.split("\n").map(s=>s.trim()).filter(Boolean),
  结果记录:f_result.value};
  if(curId)fields.expected_mtime=curEditMtime;   // 乐观锁：防止覆盖他人并发修改
  const body=curId?{action:"edit",id:curId,fields}:{action:"new",fields};
  const r=await post(body);
  if(!r.ok&&String(r.msg||"").includes("mtime-conflict")){closeModal();lastHash="";load(true);return;}
  closeModal();lastHash="";load();}
async function doArchive(){if(!curId)return;await post({action:"archive",id:curId});closeModal();lastHash="";load();}
async function doDelete(){if(!curId)return;if(!confirm("删除（移入回收站，可恢复）？"))return; await post({action:"delete",id:curId});closeModal();lastHash="";load();}
async function doRestore(){if(!curId)return; await post({action:"restore",id:curId,from:curView==="archive"?"archive":"trash"}); closeR();lastHash="";load();}
async function moveStatus(id,status){const t=TASKS.find(x=>x.id===id);
  const fields={状态:status};if(t)fields.expected_mtime=t.mtime||0;
  const r=await post({action:"edit",id:id,fields});
  if(r.ok)load(true);else{lastHash="";load(true);}}
load(true);setInterval(load,2000);
</script>
