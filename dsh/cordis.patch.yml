# ============================================================================
# dsh-fangcun —— DSH bundle patch（插件的"挂载声明"）
#
# DSH 启动时按 bundle 层栈叠加各插件的 patch，本文件把方寸插件插进 profile 的配置树。
#
# 安装：
#   dsh plugin --profile desktop add <Release 里的 .tgz 绝对路径或 https URL>
#   dsh plugin --profile desktop add link:<本目录绝对路径>   # 本地开发（改源文件立即生效）
#
# ⚠ 装完要重启 DSH（桌面端要含托盘完全退出再开）—— 插件不进热更。
# ⚠ id 与 name 必须等于 package.json 的 name：不一致的症状是"装了但插件不出现"
#   （宿主按名字找模块）。测试里钉着这一条。
# ============================================================================

- insert:
    - id: dsh-fangcun
      name: dsh-fangcun
